name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild MikuMikuWorld.sln /p:Configuration=Release /p:Platform=x64 /m

    - uses: actions/upload-artifact@v4
      with:
        name: MikuMikuWorld4CC-x64
        path: |
          x64/Release/**
          MikuMikuWorld/x64/Release/**
